<div #container class="mcp-app-frame-container"
    style="width: 100%; height: 100%; display: flex; flex-direction: column; position: relative">
    @if (error) {
    <div
        style="color: red; padding: 1rem; position: absolute; top: 0; left: 0; z-index: 10; background: rgba(255,255,255,0.9)">
        Error: {{ error.message }}
    </div>
    }
    @if (sandboxUrl()) {
    <iframe #iframe [src]="sandboxUrl()" style="width: 100%; height: 100%; border: none; flex: 1"
        sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals">
    </iframe>
    }
</div>
